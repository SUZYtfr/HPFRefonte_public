query getNewsDetails($newsId: ID) {
  newsArticle(pk: $newsId) {
    id
    title
    postDate
    content
    contentImages {
      id
      src
    }
    commentCount
    authors {
      ...BaseUserInfo
    }
    comments {
      id
      author {
        ...BaseUserInfo
      }
      content
      postDate
    }
  }
}

mutation postComment($newsArticleId: ID!, $commentData: NewsCommentInput!) {
  postComment(newsArticleId: $newsArticleId, commentData: $commentData) {
    id
  }
}
