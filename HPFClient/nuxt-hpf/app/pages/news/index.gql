query getSearchNews($pagination: OffsetPaginationInput, $order: NewsArticleOrder, $filters: NewsArticleFilters) {
  newsArticles(pagination: $pagination, order: $order, filters: $filters) {
    totalCount
    pageInfo {
      limit
      offset
    }
    results {
      id
      title
      postDate
      content
      contentImages {
        id
        src
      }
      commentCount
      authors {
        ...BaseUserInfo
      }
    }
  }
}
