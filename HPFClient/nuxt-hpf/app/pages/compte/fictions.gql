query getPrivateFictions($filters: FictionFilters, $pagination: OffsetPaginationInput, $order: FictionOrder) {
  privateFictions(filters: $filters, pagination: $pagination, order: $order) {
    totalCount
    results {
      id
      title
      status
      rating
      lastUpdateDate
      average
      chapterCount
      readCount
      reviewCount
      fandoms {
        name
      }
      characteristics {
        name
      }
    }
  }
}

query getPrivateChapters($filters: ChapterFilters) {
  privateChapters(filters: $filters) {
    results {
      id
      title
      readCount
      wordCount
      reviewCount
      average
      publicationDate
      order
    }
  }
}
