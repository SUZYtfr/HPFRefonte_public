mutation requestToken($username: String!, $password: String!) {
  requestToken(username: $username, password: $password) {
    token
  }
}

mutation createAccount($accountData: AccountInput!) {
  createAccount(accountData: $accountData) {
    id
  }
}

mutation updateProfile($profileData: UserProfileInput!) {
  updateProfile(userProfileData: $profileData) {
    user {
      id
    }
  }
}
