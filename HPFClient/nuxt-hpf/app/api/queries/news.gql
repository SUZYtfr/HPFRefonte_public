query getNews(
    $pagination: OffsetPaginationInput,
    $order: NewsArticleOrder,
    $filters: NewsArticleFilters,
    $withComments: Boolean = false,
) {
    news(pagination: $pagination, order: $order, filters: $filters) {
        totalCount
        pageInfo {
            limit
            offset
        }
        results {
            id
            title
            postDate
            content
            contentImages {
                id
                src
            }
            commentCount
            authors {
                ...BaseUserInfo
            }
            comments @include(if: $withComments) {
                id
                author: creationUser {
                    ...BaseUserInfo
                }
                content
                postDate
            }
        }
    }
}
